@media (prefers-color-scheme:dark){:root{--bg:#0e1a13;--ink:#e8efe6;--mute:#8da396;--card:#16271c;--line:#27402f;--ok:#3fbf75;--bad:#ef6a5f;--pitch:#e8efe6;--onpitch:#0e1a13}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 18px 28px;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
h1{font-size:34px;line-height:1.05;margin:12px 0 6px;letter-spacing:-.5px}
.sub{color:var(--mute);margin:0 0 22px;font-size:16px}
.grid{display:grid;gap:10px}
.cat{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font-size:18px;font-weight:700;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.cat .e{font-size:28px;width:36px;text-align:center}
.cat small{display:block;font-weight:400;color:var(--mute);font-size:13px;margin-top:2px}
.cat:active,.btn:active,.opt:active{transform:scale(.97)}
.cat.mix{background:var(--pitch);color:var(--onpitch);border-color:var(--pitch)}
.cat.mix small{color:inherit;opacity:.75}
.bar{display:flex;justify-content:space-between;color:var(--mute);font-size:15px;margin-bottom:10px}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
.track i{display:block;height:100%;background:var(--pitch);transition:width .3s}
.q{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:6px 0 16px}
.big{font-size:80px;line-height:1.1}
.big.t{font-size:32px;font-weight:800}
.stmt{font-size:22px;margin-top:12px}
.stmt.h{font-size:24px;font-weight:800;margin:0 0 14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{color:#fff;border:0;border-radius:14px;padding:14px 12px;min-height:84px;display:flex;align-items:center;gap:10px;text-align:left;font-size:18px;font-weight:700;line-height:1.15}
.opt span{font-size:20px;opacity:.8}
.opts.done .opt{opacity:.3}
.opts.done .opt.right{opacity:1;outline:4px solid var(--ink);outline-offset:2px}
.btn{width:100%;font-size:20px;font-weight:800;padding:17px;border-radius:14px;border:2px solid var(--ink);background:var(--card);color:var(--ink)}
.btn.go{background:var(--pitch);color:var(--onpitch)}
.btn:disabled{opacity:.4}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb{min-height:62px;text-align:center;font-size:17px;margin:12px 0}
.fb .v{font-weight:800;font-size:22px}
.fb.ok .v{color:var(--ok)}.fb.no .v{color:var(--bad)}
.val{font-size:54px;font-weight:800;margin:6px 0}
input[type=range]{width:100%;height:36px;accent-color:var(--pitch)}
.rng{display:flex;justify-content:space-between;color:var(--mute);font-size:14px}
.hint{color:var(--mute);font-size:14px;margin-top:12px}
.its{display:grid;gap:8px;margin-bottom:12px}
.it{display:flex;align-items:center;gap:12px;text-align:left;font-size:18px;font-weight:700;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.it b{min-width:28px;height:28px;border-radius:14px;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.it.sel{background:var(--pitch);color:var(--onpitch);border-color:var(--pitch)}
.it.sel b{border-color:var(--onpitch)}
.it.r{border-color:var(--ok)}.it.w{border-color:var(--bad)}
.score{font-size:96px;font-weight:800;text-align:center;margin:26px 0 4px;letter-spacing:-2px}
.msg{text-align:center;font-size:20px;color:var(--mute);margin-bottom:26px}
.mist{border-top:2px solid var(--line);margin-bottom:22px}
.mist div{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
</style>
</head>

};
var app=document.getElementById("app"),Q=[],i=0,score=0,miss=[],locked=false,cur="mix";
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(var k=a.length-1;k>0;k--){var j=rnd(k+1),t=a[k];a[k]=a[j];a[j]=t}return a}
function fmt(v,u){return(u==="г."?String(v):v.toLocaleString("ru-RU"))+(u?" "+u:"")}
function make(D,p){
  if(D.m==="c"){
    var all=D.d.map(function(x){return x[1]}).filter(function(x,j,a){return a.indexOf(x)===j&&x!==p[1]});
    return{m:"c",em:D.em,a:D.free?"":p[0],q:D.free?p[0]:D.q,ans:p[1],opts:shuffle([p[1]].concat(shuffle(all).slice(0,3))),sum:p[0]+" — "+p[1]};
  }
  if(D.m==="s")return{m:"s",text:p[0],ans:p[1],min:p[2],max:p[3],step:p[4],tol:p[5],u:p[6],sum:p[0]+": "+fmt(p[1],p[6])};
  var s=p[1].slice();do{shuffle(s)}while(s.join()===p[1].join());
  return{m:"o",text:p[0],order:p[1],items:s,sum:p[0]+" "+p[1].join(" → ")};
}
function build(key){
  var L={};
  Object.keys(DATA).forEach(function(k){
    if(key!=="mix"&&key!==k)return;
    var D=DATA[k],r=[];
    (D.parts||[D]).forEach(function(P){P.d.forEach(function(p){r.push({D:P,p:p})})});
    L[k]=shuffle(r);
  });
  var ks=Object.keys(L),out=[];
  while(out.length<N&&ks.length){
    var k=ks[rnd(ks.length)],x=L[k].pop();
    if(!x){ks.splice(ks.indexOf(k),1);continue}
    var it=make(x.D,x.p);
    if(it.m==="c"&&Math.random()<.25)it=tf(it);
    out.push(it);
  }
  return out;
}
function tf(q){
  var truth=Math.random()<.5,wr=q.opts.filter(function(o){return o!==q.ans});
  return{m:"t",em:q.em,a:q.a,q:q.q,shown:truth?q.ans:wr[rnd(wr.length)],truth:truth,ans:q.ans,sum:q.sum};
}
function menu(){
  var h='<h1>Квиз</h1><p class="sub">Выбери тему. Каждый раз новые вопросы.</p><div class="grid"><button class="cat mix" data-k="mix"><span class="e">🎲</span><span>Микс<small>Все режимы вперемешку</small></span></button>';
  Object.keys(DATA).forEach(function(k){var D=DATA[k];h+='<button class="cat" data-k="'+k+'"><span class="e">'+D.e+'</span><span>'+D.t+'<small>'+D.sm+'</small></span></button>'});
  app.innerHTML=h+"</div>";
  app.querySelectorAll(".cat").forEach(function(b){b.onclick=function(){start(b.dataset.k)}});
}
function start(k){cur=k;Q=build(k);i=0;score=0;miss=[];show()}
function head(q){return'<div class="q">'+(q.a?'<div class="big'+(q.em?"":" t")+'">'+q.a+"</div>":"")+'<div class="stmt'+(q.a?"":" h")+'">'+q.q+"</div>"}
function show(){
  var q=Q[i],body="";locked=false;
  if(q.m==="c"){
    body=head(q)+'</div><div class="opts" id="opts">'+
    q.opts.map(function(o,j){return'<button class="opt" data-j="'+j+'" style="background:'+COL[j]+'"><span>'+SH[j]+'</span>'+o+'</button>'}).join("")+"</div>";
  }else if(q.m==="t"){
    body=head(q)+'<div class="stmt">Ответ: <b>'+q.shown+"</b></div></div>";
  }else if(q.m==="s"){
    var mid=Math.round((q.min+q.max)/2/q.step)*q.step;
    body='<div class="q"><div class="stmt h">'+q.text+'</div><div class="val" id="val">'+fmt(mid,q.u)+'</div><input type="range" id="rg" min="'+q.min+'" max="'+q.max+'" step="'+q.step+'" value="'+mid+'"><div class="rng"><span>'+fmt(q.min,q.u)+'</span><span>'+fmt(q.max,q.u)+'</span></div><div class="hint">'+(q.tol?"Засчитывается, если ошибёшься не больше чем на "+fmt(q.tol,q.u):"Нужен точный ответ")+'</div></div>';
  }else{
    body='<div class="q" style="justify-content:flex-start"><div class="stmt h">'+q.text+'</div><div class="its" id="its"></div><div class="hint">Нажимай по порядку: 1, 2, 3…</div></div>';
  }
  app.innerHTML='<div class="bar"><span>Вопрос '+(i+1)+" из "+Q.length+'</span><span>Верно: '+score+'</span></div><div class="track"><i style="width:'+(i/Q.length*100)+'%"></i></div>'+body+'<div class="fb" id="fb"></div><div id="act"></div>';
  if(q.m==="c")app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){pick(+b.dataset.j)}});
  if(q.m==="s")slider(q);
  if(q.m==="o")order(q);
  if(q.m==="t")tfb(q);
}
function tfb(q){
  var act=document.getElementById("act");
  act.innerHTML='<div class="row"><button class="btn" data-v="1">Верно</button><button class="btn" data-v="0">Неверно</button></div>';
  act.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){
    if(locked)return;
    var ok=(b.dataset.v==="1")===q.truth;
    done(ok,q,q.truth?"":"Правильный ответ: "+q.ans);
  }});
}
function done(ok,q,html){
  locked=true;if(ok)score++;else miss.push(q.sum);
  var fb=document.getElementById("fb");fb.className="fb "+(ok?"ok":"no");
  fb.innerHTML='<div class="v">'+(ok?"Верно!":"Неверно")+"</div>"+html;
  var last=i===Q.length-1,act=document.getElementById("act");
  act.innerHTML='<button class="btn go" id="nx">'+(last?"Результат":"Дальше")+"</button>";
  document.getElementById("nx").onclick=function(){i++;last?result():show()};
  act.scrollIntoView({block:"end"});
}
function pick(j){
  if(locked)return;var q=Q[i],o=document.getElementById("opts"),bs=o.children;
  o.classList.add("done");
  for(var k=0;k<bs.length;k++)if(q.opts[k]===q.ans)bs[k].classList.add("right");
  var ok=q.opts[j]===q.ans;
  done(ok,q,ok?"":"Правильный ответ: "+q.ans);
}
function slider(q){
  var rg=document.getElementById("rg"),val=document.getElementById("val"),act=document.getElementById("act");
  rg.oninput=function(){val.textContent=fmt(+rg.value,q.u)};
  act.innerHTML='<button class="btn go" id="go">Ответить</button>';
  document.getElementById("go").onclick=function(){
    var v=+rg.value,ok=Math.abs(v-q.ans)<=q.tol;rg.disabled=true;
    done(ok,q,"Твой ответ: "+fmt(v,q.u)+"<br>Правильно: <b>"+fmt(q.ans,q.u)+"</b>");
  };
}
function order(q){
  var picks=[],its=document.getElementById("its"),act=document.getElementById("act");
  function draw(){
    its.innerHTML=q.items.map(function(t,j){var n=picks.indexOf(t);return'<button class="it'+(n>-1?" sel":"")+'" data-j="'+j+'"><b>'+(n>-1?n+1:"")+"</b>"+t+"</button>"}).join("");
    its.querySelectorAll(".it").forEach(function(b){b.onclick=function(){var t=q.items[+b.dataset.j];if(!locked&&picks.indexOf(t)<0){picks.push(t);draw()}}});
    var ck=document.getElementById("ck");if(ck)ck.disabled=picks.length<q.items.length;
  }
  act.innerHTML='<div class="row"><button class="btn" id="rs">Сбросить</button><button class="btn go" id="ck" disabled>Проверить</button></div>';
  document.getElementById("rs").onclick=function(){if(!locked){picks=[];draw()}};
  document.getElementById("ck").onclick=function(){
    var ok=picks.join()===q.order.join();
    its.innerHTML=picks.map(function(t,j){return'<div class="it '+(t===q.order[j]?"r":"w")+'"><b>'+(j+1)+"</b>"+t+"</div>"}).join("");
    done(ok,q,ok?"":"Правильный порядок: "+q.order.join(" → "));
  };
  draw();
}
function result(){
  var p=score/Q.length,m=p===1?"Идеально!":p>=.8?"Отличный результат":p>=.5?"Неплохо, можно лучше":"Попробуй ещё раз";
  var h='<div class="score">'+score+"/"+Q.length+'</div><div class="msg">'+m+"</div>";
  if(miss.length)h+='<div class="mist">'+miss.map(function(s){return"<div>"+s+"</div>"}).join("")+"</div>";
  h+='<div class="row"><button class="btn go" id="again">Ещё раз</button><button class="btn" id="home">Темы</button></div>';
  app.innerHTML=h;
  document.getElementById("home").onclick=menu;
  document.getElementById("again").onclick=function(){start(cur)};
}
menu();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
